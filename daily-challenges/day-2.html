
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 2 - Dynamic Element Creator</title>
</head>
<body>

    <h1>Dynamic Element Creator</h1>

    <button id="add-button">Add Paragraph</button>

    <div id="paragraph-container"></div>

    <script>
        let count = 0;

        const addButton = document.getElementById("add-button");
        const container = document.getElementById("paragraph-container");

        addButton.addEventListener("click", function() {
            count++;

            const paragraph = document.createElement("p");
            paragraph.textContent = "Paragraph " + count;

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";

            deleteButton.addEventListener("click", function() {
                paragraph.remove();
            });

            paragraph.appendChild(deleteButton);
            container.appendChild(paragraph);
        });
    </script>

</body>
</html>
