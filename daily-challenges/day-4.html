
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 4 - Content Copier</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f1ec;
            padding: 30px;
            text-align: center;
        }

        h1 {
            color: #4b2e2e;
        }

        .content-box {
            background: white;
            padding: 25px;
            margin: 20px auto;
            max-width: 500px;
            border-radius: 10px;
            border: 2px solid #8b5e3c;
        }

        #source {
            cursor: grab;
        }

        #target {
            min-height: 100px;
            border-style: dashed;
        }

        button {
            padding: 12px 20px;
            background: #8b5e3c;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>Day 4: Content Copier</h1>

    <div class="content-box" id="source" draggable="true">
        <h2>Source Content</h2>
        <p>This content will be copied into the target section.</p>
        <p>Learning JavaScript DOM manipulation is fun!</p>
    </div>

    <button id="copy-button">Copy Content</button>

    <div class="content-box" id="target">
        <h2>Target Content</h2>
        <p>Copied content will appear here.</p>
    </div>

    <script>
        const source = document.getElementById("source");
        const target = document.getElementById("target");
        const copyButton = document.getElementById("copy-button");

        // Copy content using the button
        copyButton.addEventListener("click", function() {
            target.innerHTML = source.innerHTML;
            console.log("Content copied successfully!");
        });

        // Bonus: Drag and drop
        source.addEventListener("dragstart", function(event) {
            event.dataTransfer.setData("text/plain", "copy-content");
        });

        target.addEventListener("dragover", function(event) {
            event.preventDefault();
        });

        target.addEventListener("drop", function(event) {
            event.preventDefault();

            target.innerHTML = source.innerHTML;

            console.log("Content copied using drag and drop!");
        });
    </script>

</body>
</html>
