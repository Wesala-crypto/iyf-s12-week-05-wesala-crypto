
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day 3 - Image Remover</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
            background-color: #f4f1ec;
        }

        h1 {
            color: #4b2e2e;
        }

        button {
            padding: 12px 20px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            background-color: #8b5e3c;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #4b2e2e;
        }

        #image-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }

        #image-container img {
            width: 250px;
            height: 180px;
            object-fit: cover;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Day 3: Image Remover Challenge</h1>

    <p>Practice removing, hiding and showing images using JavaScript DOM manipulation.</p>

    <button id="remove-button">Remove All Images</button>
    <button id="toggle-button">Hide Images</button>

    <div id="image-container">

        <img
            src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=400"
            alt="Beautiful green landscape"
        >

        <img
            src="https://images.unsplash.com/photo-1501785885888-8f6c9c0e5c5f?w=400"
            alt="Mountain lake scenery"
        >

        <img
            src="https://images.unsplash.com/photo-1490730141103-6cac27aaab94?w=400"
            alt="Beautiful sunset scenery"
        >

    </div>

    <script>
        const removeButton = document.getElementById("remove-button");
        const toggleButton = document.getElementById("toggle-button");

        // Remove all images permanently
        removeButton.addEventListener("click", function() {
            const images = document.querySelectorAll("#image-container img");

            images.forEach(function(image) {
                image.remove();
            });
        });

        // Bonus: Hide and show images
        let imagesHidden = false;

        toggleButton.addEventListener("click", function() {
            const images = document.querySelectorAll("#image-container img");

            imagesHidden = !imagesHidden;

            images.forEach(function(image) {
                image.style.display = imagesHidden ? "none" : "block";
            });

            toggleButton.textContent = imagesHidden
                ? "Show Images"
                : "Hide Images";
        });
    </script>

</body>
</html>
